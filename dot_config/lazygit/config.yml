customCommands:
  - key: "<c-c>"
    context: "files"
    description: 'commit files with format'
    prompts:
      - type: "menu"
        title: "Choice the Emoji"
        key: "Emoji"
        options:
          # ==== High Frequency ====
          - name: "✨ sparkles"
            description: "新機能を導入する。"
            value: "sparkles"
          - name: "🐛 bug"
            description: "バグを修正する。"
            value: "bug"
          - name: "♻️ recycle"
            description: "コードをリファクタリングする。"
            value: "recycle"
          - name: "📝 memo"
            description: "ドキュメントを追加または更新する。"
            value: "memo"
          - name: "🎨 art"
            description: "コードの構造やフォーマットを改善する。"
            value: "art"
          - name: "🚧 construction"
            description: "作業中。"
            value: "construction"
          - name: "✅ white_check_mark"
            description: "テストを追加、更新、またはパスさせる。"
            value: "white_check_mark"
          - name: "🔧 wrench"
            description: "設定ファイルを変更または更新する。"
            value: "wrench"
          - name: "💄 lipstick"
            description: "UIとスタイルファイルを追加または更新する。"
            value: "lipstick"
          - name: "🚀 rocket"
            description: "デプロイする。"
            value: "rocket"
          - name: "🔒️ lock"
            description: "セキュリティまたはプライバシーの問題を修正する。"
            value: "lock"
          - name: "🏷️ label"
            description: "型（Type）を追加または更新する。"
            value: "label"
          - name: "🧹 wastebasket"
            description: "整理が必要なコードを非推奨にする（Deprecate）。"
            value: "wastebasket"
          # ==== Dependencies & Build ====
          - name: "➕ heavy_plus_sign"
            description: "依存関係を追加する。"
            value: "heavy_plus_sign"
          - name: "➖ heavy_minus_sign"
            description: "依存関係を削除する。"
            value: "heavy_minus_sign"
          - name: "⬆️ arrow_up"
            description: "依存関係をアップグレードする。"
            value: "arrow_up"
          - name: "⬇️ arrow_down"
            description: "依存関係をダウングレードする。"
            value: "arrow_down"
          - name: "📌 pushpin"
            description: "依存関係を特定バージョンに固定する。"
            value: "pushpin"
          - name: "👷 construction_worker"
            description: "CIビルドシステムを追加または更新する。"
            value: "construction_worker"
          - name: "💚 green_heart"
            description: "CIビルドを修正する。"
            value: "green_heart"
          - name: "📦️ package"
            description: "コンパイル済みのファイルやパッケージを追加または更新する。"
            value: "package"
          - name: "⚡️zap"
            description: "パフォーマンスを改善する。"
            value: "zap"
          # ==== Management & Operations ====
          - name: "🎉 tada"
            description: "プロジェクトを開始する。"
            value: "tada"
          - name: "🔖 bookmark"
            description: "リリース / バージョンのタグ付け。"
            value: "bookmark"
          - name: "🚑️ ambulance"
            description: "致命的なホットフィックス。"
            value: "ambulance"
          - name: "⏪️ rewind"
            description: "変更を元に戻す（リバート）。"
            value: "rewind"
          - name: "🔀 twisted_rightwards_arrows"
            description: "ブランチをマージする。"
            value: "twisted_rightwards_arrows"
          - name: "💥 boom"
            description: "破壊的変更（Breaking Changes）を導入する。"
            value: "boom"
          - name: "🐳 docker"
            description: "Dockerの設定など。"
            value: "docker"
          - name: "🧱 bricks"
            description: "インフラ関連の変更を行う。"
            value: "bricks"
          - name: "🌐 globe_with_meridians"
            description: "国際化と地域化。"
            value: "globe_with_meridians"
          # ==== Specific Contexts ====
          - name: "✏️ pencil2"
            description: "タイプミスを修正する。"
            value: "pencil2"
          - name: "🗃️ card_file_box"
            description: "データベース関連の変更を行う。"
            value: "card_file_box"
          - name: "👔 necktie"
            description: "ビジネスロジックを追加または更新する。"
            value: "necktie"
          - name: "🦺 safety_vest"
            description: "バリデーション関連のコードを追加または更新する。"
            value: "safety_vest"
          - name: "👽️ alien"
            description: "外部APIの変更に合わせてコードを更新する。"
            value: "alien"
          - name: "📄 page_facing_up"
            description: "ライセンスを追加または更新する。"
            value: "page_facing_up"
          - name: "🍱 bento"
            description: "アセットを追加または更新する。"
            value: "bento"
          - name: "♿️ wheelchair"
            description: "アクセシビリティを改善する。"
            value: "wheelchair"
          - name: "💡 bulb"
            description: "ソースコードにコメントを追加または更新する。"
            value: "bulb"
          - name: "🔊 loud_sound"
            description: "ログを追加または更新する。"
            value: "loud_sound"
          - name: "🔇 mute"
            description: "ログを削除する。"
            value: "mute"
          - name: "👥 busts_in_silhouette"
            description: "コントリビューターを追加または更新する。"
            value: "busts_in_silhouette"
          - name: "🚸 children_crossing"
            description: "UXやユーザビリティを改善する。"
            value: "children_crossing"
          - name: "📱 iphone"
            description: "レスポンシブデザイン対応を行う。"
            value: "iphone"
          - name: "🔍️ mag"
            description: "SEOを改善する。"
            value: "mag"
          - name: "🥅 goal_net"
            description: "エラーを捕捉する。"
            value: "goal_net"
          - name: "🛂 passport_control"
            description: "認可、ロール、権限に関連するコードを修正する。"
            value: "passport_control"
          - name: "🩹 adhesive_bandage"
            description: "致命的ではない問題の単純な修正。"
            value: "adhesive_bandage"
          - name: "🧐 monocle_face"
            description: "データの探索や検査を行う。"
            value: "monocle_face"
          - name: "⚰️ coffin"
            description: "デッドコードを削除する。"
            value: "coffin"
          - name: "🧪 test_tube"
            description: "失敗するテストを追加する。"
            value: "test_tube"
          - name: "🩺 stethoscope"
            description: "ヘルスチェックを追加または更新する。"
            value: "stethoscope"
          - name: "🧑‍💻 technologist"
            description: "開発者体験（DX）を改善する。"
            value: "technologist"
          - name: "🧵 thread"
            description: "並行処理に関連するコードを追加または更新する。"
            value: "thread"
          # ==== Misc / Others ====
          - name: "🔥 fire"
            description: "コードやファイルを削除する。"
            value: "fire"
          - name: "🚚 truck"
            description: "移動または名前変更。"
            value: "truck"
          - name: "🏗️ building_construction"
            description: "アーキテクチャを変更する。"
            value: "building_construction"
          - name: "🔨 hammer"
            description: "開発スクリプトを追加または更新する。"
            value: "hammer"
          - name: "📈 chart_with_upwards_trend"
            description: "分析または追跡コードを追加または更新する。"
            value: "chart_with_upwards_trend"
          - name: "🚨 rotating_light"
            description: "警告を修正する。"
            value: "rotating_light"
          - name: "🔐 closed_lock_with_key"
            description: "シークレットを追加または更新する。"
            value: "closed_lock_with_key"
          - name: "🌱 seedling"
            description: "シードファイルを追加または更新する。"
            value: "seedling"
          - name: "🚩 triangular_flag_on_post"
            description: "機能フラグ操作。"
            value: "triangular_flag_on_post"
          - name: "💫 dizzy"
            description: "アニメーションを追加または更新する。"
            value: "dizzy"
          - name: "🤡 clown_face"
            description: "モックを作成する。"
            value: "clown_face"
          - name: "🥚 egg"
            description: "イースターエッグ。"
            value: "egg"
          - name: "🙈 see_no_evil"
            description: ".gitignoreを更新する。"
            value: "see_no_evil"
          - name: "📸 camera_flash"
            description: "スナップショットを更新する。"
            value: "camera_flash"
          - name: "⚗️ alembic"
            description: "実験を行う。"
            value: "alembic"
          - name: "💸 money_with_wings"
            description: "資金関連のインフラを追加。"
            value: "money_with_wings"
          - name: "✈️ airplane"
            description: "オフラインサポートを改善。"
            value: "airplane"
          - name: "🦖 t-rex"
            description: "後方互換性。"
            value: "t-rex"
          - name: "💩 poop"
            description: "改善が必要な質の悪いコード。"
            value: "poop"
          - name: "🍻 beers"
            description: "酔っ払ってコードを書く。"
            value: "beers"
          - name: "💬 speech_balloon"
            description: "テキストやリテラルの追加。"
            value: "speech_balloon"
      - type: "input"
        title: "(Optional) Enter the scope"
        key: "Scope"
        initialValue: ""
      - type: "input"
        title: "Enter the Message"
        key: "Message"
        initialValue: ""
      - type: "confirm"
        title: "Commit"
        body: "Commit with the message ':{{.Form.Emoji}}:{{if .Form.Scope}} [{{.Form.Scope}}]{{end}} {{.Form.Message}}'. Is this okay?"
    command: "bash -c 'emoji=\"{{.Form.Emoji}}\"; scope=\"{{.Form.Scope}}\"; message=\"{{.Form.Message}}\"; commit_message=\":$emoji:$([[ -n \"$scope\" ]] && echo \" [$scope]\") $message\"; git commit -m \"$commit_message\"'"
    loadingText: "Commiting..."

